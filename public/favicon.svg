<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24201C"/>
      <stop offset="100%" stop-color="#141210"/>
    </linearGradient>
  </defs>
  <!-- Background Squircle -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#D36241" stroke-opacity="0.4" stroke-width="1.5"/>
  
  <!-- Monogram OL with terracotta dot -->
  <text x="28" y="42" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="26" 
        font-weight="800" 
        fill="#FAF8F5" 
        text-anchor="middle" 
        letter-spacing="-0.5">OL</text>
  <!-- Brand Signature Terracotta Accent Dot -->
  <circle cx="49" cy="39" r="3.2" fill="#D36241"/>
</svg>
